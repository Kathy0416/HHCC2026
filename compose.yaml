services:
  migraine-app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: ./server/.env
        required: false
      - path: ./.env
        required: false
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      SERVE_FRONTEND: "1"
      DB_PATH: /data/data.db
    volumes:
      - migraine-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  migraine-data:
